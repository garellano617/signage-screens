<!doctype html>
<!-- Loaded by the Android player (bundled in the APK) to show a widget slide. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="widgets.css">
  <link rel="stylesheet" href="overlay.css">
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #000; } #w { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }</style>
</head>
<body>
  <div id="w"></div>
  <script src="overlay.js"></script>
  <script src="widgets.js"></script>
  <script>
    var current = null;
    // Called by the player: the widget ({ type, config }) and its live data (or null).
    window.showWidget = function (widget, data) {
      if (current) current.destroy();
      current = SignageWidgets.render(document.getElementById("w"), widget, data);
    };
  </script>
</body>
</html>
