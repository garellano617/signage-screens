# Render Blueprint: the signage admin portal website.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: signage-portal
    runtime: docker
    dockerfilePath: ./portal/Dockerfile
    dockerContext: ./portal
    # Starter is the smallest plan that can have a persistent disk (needed for the database and uploads).
    plan: starter
    region: virginia
    healthCheckPath: /healthz
    # Own address. DNS (Network Solutions): CNAME signage -> signage-portal.onrender.com
    domains:
      - signage.precom.net
    autoDeploy: true
    buildFilter:
      paths:
        - portal/**
      ignoredPaths:
        - portal/test/**
    disk:
      name: signage-data
      mountPath: /data
      # Holds the database, uploaded images/videos, screenshots and the player APK. Can be enlarged later, not shrunk.
      sizeGB: 10
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      # Asked for when the Blueprint is created; used once to create the first admin login.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: show each client's billing status from the Premier Signage Billing app.
      - key: BILLING_URL
        sync: false
      - key: BILLING_KEY
        sync: false
      # This portal's address (used in password reset emails).
      - key: PUBLIC_URL
        value: https://signage.precom.net
      # Optional: email for "Forgot password?" (same settings as the billing app).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional: client login codes by text (Sent). Each text costs money; email codes are free.
      #   SENT_CODE_TEMPLATE = ID of an approved Sent template for login codes, with a variable named "code".
      - key: SENT_API_KEY
        sync: false
      - key: SENT_CODE_TEMPLATE
        sync: false
